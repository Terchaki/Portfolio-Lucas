<header>
  <nav class="container">
    <div class="navigation">
      <div class="brand">
        <a href="#inicio">
          <span class="brand__dot">.Dev</span>
          <span class="brand__name">&lt;/Lucas&gt;</span>
        </a>
      </div>

      <div class="menu-wrap" [class.active]="menuAtivo">

        <button (click)="alternarMenu($event)" (touchstart)="alternarMenu($event)" id="btn-menu"
          [attr.aria-label]="t.menuOpen">
          MENU <span id="hamburguer"></span>
        </button>

        <ul id="menu">
          <li><a href="#sobre-mim" (click)="fecharMenu()">{{ t.about }}</a></li>
          <li><a href="#habilidades" (click)="fecharMenu()">{{ t.skills }}</a></li>
          <li><a href="#projetos" (click)="fecharMenu()">{{ t.projects }}</a></li>
          <li><a href="#experiencia" (click)="fecharMenu()">{{ t.experience }}</a></li>
          <li><a href="#contato" (click)="fecharMenu()">{{ t.contact }}</a></li>
        </ul>

        <button type="button" class="theme-toggle" (click)="alternarIdioma()"
          [attr.aria-label]="t.switchLanguageAria">
          {{ t.languageButton }}
        </button>

        <button type="button" class="theme-toggle" (click)="alternarTema()"
          [attr.aria-label]="temaAtual === 'dark' ? t.themeLightAria : t.themeDarkAria">
          <i [class]="temaAtual === 'dark' ? 'fas fa-sun' : 'fas fa-moon'"></i>
        </button>
      </div>
    </div>
  </nav>
</header>
