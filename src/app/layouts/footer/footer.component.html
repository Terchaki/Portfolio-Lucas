<footer>
  <div class="footer__top">
    <div class="container">
      <div class="footer-content">

        <div class="d-none d-md-block">
          <ng-container *ngTemplateOutlet="brandTemplate"></ng-container>
        </div>

        <div class="footer__section footer__links">
          <h4>{{ t.navigation }}</h4>
          <ul>
            <li><a href="#sobre-mim">{{ t.about }}</a></li>
            <li><a href="#habilidades">{{ t.skills }}</a></li>
            <li><a href="#projetos">{{ t.projects }}</a></li>
            <li><a href="#experiencia">{{ t.experience }}</a></li>
          </ul>
        </div>

        <div class="footer__section footer__contact">
          <h4>{{ t.connect }}</h4>
          <div class="contact-items">
            <a href="https://wa.me/5564992048816" target="_blank" rel="noopener noreferrer" class="contact-item">
              <i class="fab fa-whatsapp"></i>
              <span>WhatsApp</span>
            </a>
            <a href="mailto:lucas.dev.contato@outlook.com" class="contact-item">
              <i class="fas fa-envelope"></i>
              <span>lucas.dev.contato&#64;outlook.com</span>
            </a>
          </div>

          <div class="social-icons">
            <a href="https://github.com/Terchaki" target="_blank" rel="noopener noreferrer" aria-label="GitHub"
              class="social-link">
              <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/lucas-henrique-sousa-mendes/" target="_blank" rel="noopener noreferrer"
              aria-label="LinkedIn" class="social-link">
              <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://wa.me/5564992048816" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"
              class="social-link">
              <i class="fab fa-whatsapp"></i>
            </a>
          </div>
        </div>

        <div class="d-md-none footer__brand-mobile">
          <ng-container *ngTemplateOutlet="brandTemplate"></ng-container>
        </div>
      </div>
    </div>
  </div>

  <ng-template #brandTemplate>
    <div class="footer__section footer__brand">
      <div class="brand-info">
        <div class="brand-icon">
          <a href="#inicio">
            <span class="brand-dot">.Dev</span>
            <span class="brand-name">&lt;/Lucas&gt;</span>
          </a>
        </div>
        <p class="brand-tagline">{{ t.tagline }}</p>
        <p class="brand-description">
          {{ t.brandDescription }}
        </p>
      </div>
    </div>
  </ng-template>

  <div class="footer__bottom">
    <div class="container">
      <p>&copy; {{ currentYear }} - {{ t.developedBy }} Lucas Henrique</p>
    </div>
  </div>
</footer>
